name: Atualizar top doadores

# Como roda sozinho:
# - Cada rodada espera 5 minutos (o ambiente "espera" tem um temporizador, que não ocupa máquina), calcula o ranking,
#   publica se mudou e chama a próxima rodada. É uma corrente: não depende do agendamento do GitHub, que em repositório
#   novo ou parado atrasa muito (em 2026-11-13 não disparou nenhuma vez em uma hora).
# - O agendamento abaixo é só o vigia: se a corrente parar por algum motivo, ele começa outra.
# - O "concurrency" garante uma corrente só: rodada nova espera a atual acabar, e uma segunda na fila derruba a primeira.
# - Para parar: crie a variável TOP_PARAR=1 no repositório (Settings > Secrets and variables > Actions > Variables)
#   ou desative o workflow.

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment: espera
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Trazer o ranking publicado
        run: |
          git fetch origin gh-pages
          git worktree add --detach ../site origin/gh-pages

      - name: Calcular o ranking
        env:
          CENTRALCART_API_KEY: ${{ secrets.CENTRALCART_API_KEY }}
        run: python3 gerar.py ../site/top.json

      - name: Publicar se mudou
        run: |
          cd ../site
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add top.json
            git commit -m "Ranking atualizado"
            git push origin HEAD:gh-pages
          else
            echo "sem mudança no ranking"
          fi

      - name: Chamar a próxima rodada
        if: always() && vars.TOP_PARAR != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atualizar.yml --repo "$GITHUB_REPOSITORY" --ref main
